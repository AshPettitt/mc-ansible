---
# defaults/main.yml
#
# Default values for the mc-idle-shutdown feature.
# Override any of these in extra-environment-vars.yml passed via:
#   ansible-playbook playbooks/mc-setup-playbook.yml -e '@/root/extra-environment-vars.yml'
#
# Effective idle window before shutdown:
#   mc_idle_timer_interval x mc_idle_cycles_threshold
#   e.g. 10min x 12 = 120 minutes of consecutive idleness

mc_port: 25565
mc_state_file: /var/lib/mc-idle-shutdown/state
mc_idle_cycles_threshold: 12
mc_idle_timer_boot_delay: "10min"
mc_idle_timer_interval: "10min"
