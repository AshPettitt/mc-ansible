---
- name: Count and delete modpack files except exclusions
  shell: |
    FILES=$(find /opt/minecraft/server/ -mindepth 1 \
      ! -path '/opt/minecraft/server/backups' \
      ! -path '/opt/minecraft/server/backups/*' \
      ! -path '/opt/minecraft/server/world' \
      ! -path '/opt/minecraft/server/world/*' \
      ! -path '/opt/minecraft/server/eula.txt' \
      ! -path '/opt/minecraft/server/server.properties' \
      ! -path '/opt/minecraft/server/whitelist.json' \
      ! -path '/opt/minecraft/server/ops.json')
    COUNT=$(echo "$FILES" | grep -c .)
    echo "$FILES" | xargs -d '\n' rm -rf
    echo "Deleted $COUNT items"
  args:
    executable: /bin/bash
  register: deletion_result
  changed_when: true
  tags:
    - always

- name: Display deletion count
  debug:
    msg: "{{ deletion_result.stdout }}"
  tags:
    - always