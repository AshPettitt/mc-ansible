---
- name: Reload systemd to recognize the new service
  command: systemctl daemon-reload
  become: true
  become_user: root
  tags:
    - always
  when: SERVICE_STATE == "enable"

- name: Enable Minecraft service
  systemd:
    name: minecraft
    enabled: yes
  become: true
  become_user: root
  tags:
    - always
  when: SERVICE_STATE == "enable"

- name: Stop Minecraft service
  systemd:
    name: minecraft
    state: stopped
  ignore_errors: true
  become: true
  become_user: root
  register: minecraft_service
  tags:
    - always
  when: SERVICE_STATE == "stop"  

- name: Start Minecraft service
  systemd:
    name: minecraft
    state: started
  become: true
  become_user: root
  register: minecraft_service
  tags:
    - always
  when: SERVICE_STATE == "start" 

- name: Check Minecraft service state
  debug:
    msg: "Minecraft service is {{ minecraft_service.state }}"
  tags:
    - always
  when: SERVICE_STATE == "start"