---
- name: Send command to Minecraft server via mcrcon
  ansible.builtin.command:
    argv:
      - /opt/minecraft/tools/mcrcon/mcrcon
      - -H
      - localhost
      - -P
      - "{{ RCON_PORT | default(25575) }}"
      - -p
      - "{{ RCON_PASSWORD }}"
      - "{{ RCON_COMMAND }}"
  register: mcrcon_output
  changed_when: false
  tags:
    - always

- name: "mcrcon result: {{ mcrcon_output.stdout | replace('\n', ' ') }} stderr: {{ mcrcon_output.stderr }}"
  ansible.builtin.debug:
    msg: "see task name"
  tags:
    - always